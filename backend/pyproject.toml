[project]
name = "audiovault-backend"
description = "AudioVault media-processing API"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.142",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
